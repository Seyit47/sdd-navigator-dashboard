# Deterministic checks (SCD-VAL-002): type check, lint, tests, build and the requirement coverage gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      # Layout, pending feedback, server-side filtering and theming in real Chrome
      # (preinstalled on GitHub's Ubuntu runners), against the build from `validate`.
      - name: Browser checks
        run: pnpm check:browser

      # The live SDD Navigator API still matches the schemas and honours the filter params.
      - name: Live API contract
        run: pnpm test:contract
