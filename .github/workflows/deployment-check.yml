# @req SCD-DEP-002, SCD-VAL-002
# After Vercel reports a successful Production deployment, run the browser checks against the
# public Production URL (package.json "homepage"). The per-deployment URL in the event payload
# sits behind Vercel Deployment Protection, so it cannot be checked without a login.
name: Deployment check

on:
  deployment_status:

permissions:
  contents: read

jobs:
  browser-checks:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Chrome version
        run: google-chrome --version

      - name: Public Production URL
        run: echo "BASE_URL=$(node -p 'const pkg = require("./package.json"); pkg.homepage')" >> "$GITHUB_ENV"

      - name: Browser checks against Production
        env:
          # Production must run against the live API (NEXT_PUBLIC_API_URL set in Vercel).
          EXPECT_DATA_MODE: api
        run: pnpm check:browser
